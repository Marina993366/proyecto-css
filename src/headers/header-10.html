<!doctype html>
<html lang="en">
    <head>

        <link rel="stylesheet" href="../../src/style.css" />

    <body class="forum">
        <header>

            </figure>
            
            <nav>
                <ul>
                    <li><a href="../../index.html"><span class="underline">Ho</span>me</a></li>

                    <li><a href="#contact">Contact</a></li>

        <section class="hero">
